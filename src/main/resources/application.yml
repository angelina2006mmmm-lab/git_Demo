spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bank_cards?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.xml

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  crypto:
    secret: ${CRYPTO_SECRET:change-this-card-encryption-secret-32-chars-min}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
