<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все люди</title>
</head>
<body>

<div th:each="person : ${people}">
    <a th:href="@{/people/{id}(id=${person.getId()})}" th:text="${person.getName()}">user</a>
    <span th:text="${person.getAge() + ' years old,'}">age</span>
    <span th:text="${person.getEmail() + ' :email'}">email</span>
</div>

<br/>
<hr/>

<a href="spring-course/people/new">Create new person</a>

</body>
</html>
