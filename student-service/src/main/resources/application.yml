server: { port: 8080 }
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate: { ddl-auto: update }
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
security:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-that-is-at-least-32-bytes}
    expiration-ms: 3600000
