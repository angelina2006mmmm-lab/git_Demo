apiVersion: v1
kind: ConfigMap
metadata: { name: student-service-config }
data:
  DB_URL: jdbc:postgresql://postgres:5432/student_db
  DB_USERNAME: postgres
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: student-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: student-service } }
  template:
    metadata: { labels: { app: student-service } }
    spec:
      containers:
        - name: student-service
          image: student-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: student-service-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: student-service }
spec:
  selector: { app: student-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: student-platform-ingress }
spec:
  rules:
    - host: student.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: student-service, port: { number: 80 } }
